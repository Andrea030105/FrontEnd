<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sp-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123A57"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="sp-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#233248"/>
      <stop offset="100%" stop-color="#0E1826"/>
    </linearGradient>
    <filter id="sp-shadow" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0B1B2E" flood-opacity="0.22"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="148" rx="34" ry="6" fill="#0B1B2E" opacity="0.10"/>

  <g filter="url(#sp-shadow)">
    <rect x="70" y="8" width="60" height="140" rx="14" fill="url(#sp-body)"/>
    <rect x="74" y="13" width="52" height="130" rx="10" fill="url(#sp-screen)"/>

    <!-- notch/fotocamera anteriore -->
    <circle cx="100" cy="21" r="1.6" fill="#0B1B2E" opacity="0.6"/>

    <!-- contenuto schermo: piccola dashboard con card e grafico -->
    <rect x="80" y="34" width="40" height="18" rx="4" fill="#FFFFFF" opacity="0.14"/>
    <path d="M83 47 L90 40 L96 45 L104 34 L110 40 L117 36" fill="none" stroke="#7DE3F4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="90" cy="65" r="7" fill="#FFFFFF" opacity="0.16"/>
    <rect x="101" y="60" width="19" height="10" rx="3" fill="#FFFFFF" opacity="0.12"/>
    <rect x="80" y="78" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.18"/>
    <rect x="80" y="88" width="26" height="5" rx="2.5" fill="#FFFFFF" opacity="0.12"/>

    <!-- home indicator -->
    <rect x="92" y="136" width="16" height="3" rx="1.5" fill="#FFFFFF" opacity="0.5"/>

    <!-- modulo fotocamera posteriore (accennato sul bordo) -->
    <circle cx="122" cy="20" r="4.5" fill="#0B1B2E" opacity="0.35"/>
    <circle cx="122" cy="20" r="2.2" fill="#0E1826"/>
  </g>
</svg>
