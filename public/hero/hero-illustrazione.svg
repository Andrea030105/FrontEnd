<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="h-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B2E"/>
      <stop offset="50%" stop-color="#164A6E"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="h-bezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A3547"/>
      <stop offset="100%" stop-color="#0E1826"/>
    </linearGradient>
    <linearGradient id="h-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F3F7"/>
      <stop offset="100%" stop-color="#C7CEDB"/>
    </linearGradient>
    <linearGradient id="h-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DFE4EC"/>
      <stop offset="100%" stop-color="#AAB2C2"/>
    </linearGradient>
    <linearGradient id="h-cup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A3A52"/>
      <stop offset="100%" stop-color="#0E1826"/>
    </linearGradient>
    <radialGradient id="h-cushion" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3C4D68"/>
      <stop offset="100%" stop-color="#182333"/>
    </radialGradient>
    <linearGradient id="h-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2F6FED"/>
    </linearGradient>
    <linearGradient id="h-phonebody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26344A"/>
      <stop offset="100%" stop-color="#0E1826"/>
    </linearGradient>
    <radialGradient id="h-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#2F6FED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2F6FED" stop-opacity="0"/>
    </radialGradient>
    <filter id="h-shadow" x="-40%" y="-40%" width="200%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0B1B2E" flood-opacity="0.22"/>
    </filter>
    <filter id="h-shadow-sm" x="-60%" y="-60%" width="240%" height="260%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B1B2E" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- glow di sfondo -->
  <ellipse cx="320" cy="255" rx="310" ry="230" fill="url(#h-glow)"/>

  <!-- ombra a terra -->
  <ellipse cx="320" cy="426" rx="240" ry="16" fill="#0B1B2E" opacity="0.08"/>

  <!-- chip UI fluttuante in alto a sinistra -->
  <g filter="url(#h-shadow-sm)" transform="translate(56,72)">
    <rect width="108" height="46" rx="14" fill="#FFFFFF"/>
    <circle cx="24" cy="23" r="12" fill="#EAF1FD"/>
    <path d="M18 23 L22 27 L30 18" stroke="#2F6FED" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="44" y="14" width="50" height="7" rx="3.5" fill="#DCE3EE"/>
    <rect x="44" y="26" width="34" height="6" rx="3" fill="#EAEDF3"/>
  </g>

  <!-- chip grafico in alto a destra -->
  <g filter="url(#h-shadow-sm)" transform="translate(508,64)">
    <rect width="96" height="58" rx="14" fill="#FFFFFF"/>
    <path d="M14 40 L28 26 L40 34 L56 16 L82 24" fill="none" stroke="#2F6FED" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="82" cy="24" r="3" fill="#22D3EE"/>
    <text x="14" y="50" font-family="'Inter','Segoe UI',sans-serif" font-size="9" font-weight="700" fill="#17233B">+24%</text>
  </g>

  <!-- laptop (sfondo, a sinistra) -->
  <g filter="url(#h-shadow)">
    <rect x="60" y="78" width="290" height="192" rx="16" fill="url(#h-bezel)"/>
    <rect x="72" y="90" width="266" height="168" rx="7" fill="url(#h-screen)"/>
    <path d="M76 210 C 128 168, 180 236, 250 188 C 278 168, 296 196, 330 180 L330 254 L76 254 Z" fill="#FFFFFF" opacity="0.09"/>
    <rect x="88" y="108" width="58" height="8" rx="4" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="308" cy="112" r="3" fill="#7DE3F4"/>

    <path d="M36 270 L374 270 L400 310 C402 316 397 322 390 322 L20 322 C13 322 8 316 10 310 Z" fill="url(#h-body)"/>
    <path d="M36 270 L374 270 L382 282 L28 282 Z" fill="url(#h-edge)"/>
    <rect x="182" y="295" width="42" height="5.5" rx="2.75" fill="#9AA3B5"/>
  </g>

  <!-- smartphone (dietro a destra, dietro alle cuffie) -->
  <g filter="url(#h-shadow)" transform="translate(486,96)">
    <rect x="0" y="0" width="98" height="196" rx="20" fill="url(#h-phonebody)"/>
    <rect x="6" y="7" width="86" height="182" rx="14" fill="url(#h-screen)"/>
    <circle cx="49" cy="18" r="1.8" fill="#0B1B2E" opacity="0.6"/>

    <rect x="16" y="34" width="66" height="26" rx="6" fill="#FFFFFF" opacity="0.13"/>
    <path d="M20 100 L37 82 L53 98 L70 74" fill="none" stroke="#7DE3F4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="30" cy="128" r="9" fill="#FFFFFF" opacity="0.14"/>
    <rect x="47" y="121" width="27" height="14" rx="4" fill="#FFFFFF" opacity="0.11"/>
    <rect x="16" y="150" width="66" height="7" rx="3.5" fill="#FFFFFF" opacity="0.16"/>

    <rect x="39" y="182" width="20" height="3.4" rx="1.7" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="84" cy="16" r="5" fill="#0B1B2E" opacity="0.35"/>
    <circle cx="84" cy="16" r="2.4" fill="#0E1826"/>
  </g>

  <!-- cuffie: oggetto compatto e autonomo, appoggiato nello spazio tra laptop e telefono -->
  <g filter="url(#h-shadow)" transform="translate(352,258)">
    <ellipse cx="68" cy="150" rx="70" ry="10" fill="#0B1B2E" opacity="0.10"/>
    <path d="M6 62 A 62 62 0 0 1 130 62" fill="none" stroke="url(#h-ring)" stroke-width="14" stroke-linecap="round"/>
    <path d="M6 62 A 62 62 0 0 1 130 62" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.6" stroke-linecap="round" transform="translate(0,-2.2)"/>
    <path d="M4 54 L-1 88" stroke="#22344A" stroke-width="7" stroke-linecap="round"/>
    <path d="M132 54 L137 88" stroke="#22344A" stroke-width="7" stroke-linecap="round"/>

    <rect x="-14" y="48" width="48" height="72" rx="22" fill="url(#h-cup)"/>
    <circle cx="10" cy="84" r="16" fill="url(#h-cushion)"/>
    <circle cx="10" cy="84" r="16" fill="none" stroke="#38BDF8" stroke-width="2.4" opacity="0.75"/>
    <circle cx="3" cy="76" r="3.6" fill="#FFFFFF" opacity="0.2"/>

    <rect x="102" y="48" width="48" height="72" rx="22" fill="url(#h-cup)"/>
    <circle cx="126" cy="84" r="16" fill="url(#h-cushion)"/>
    <circle cx="126" cy="84" r="16" fill="none" stroke="#38BDF8" stroke-width="2.4" opacity="0.75"/>
    <circle cx="119" cy="76" r="3.6" fill="#FFFFFF" opacity="0.2"/>
  </g>
</svg>
