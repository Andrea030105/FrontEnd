<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hp-band" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2F6FED"/>
    </linearGradient>
    <linearGradient id="hp-cup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28374E"/>
      <stop offset="100%" stop-color="#0E1826"/>
    </linearGradient>
    <radialGradient id="hp-cushion" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3A4A63"/>
      <stop offset="100%" stop-color="#182333"/>
    </radialGradient>
    <filter id="hp-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0B1B2E" flood-opacity="0.20"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="146" rx="60" ry="6" fill="#0B1B2E" opacity="0.10"/>

  <g filter="url(#hp-shadow)">
    <!-- archetto -->
    <path d="M28 88 A 72 72 0 0 1 172 88" fill="none" stroke="url(#hp-band)" stroke-width="10" stroke-linecap="round"/>
    <path d="M28 88 A 72 72 0 0 1 172 88" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.4" stroke-linecap="round" transform="translate(0,-2)"/>

    <!-- staffe -->
    <path d="M25 80 L21 108" stroke="#22344A" stroke-width="6" stroke-linecap="round"/>
    <path d="M175 80 L179 108" stroke="#22344A" stroke-width="6" stroke-linecap="round"/>

    <!-- padiglione sinistro -->
    <rect x="8" y="80" width="38" height="58" rx="18" fill="url(#hp-cup)"/>
    <circle cx="27" cy="109" r="13.5" fill="url(#hp-cushion)"/>
    <circle cx="27" cy="109" r="13.5" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.7"/>
    <circle cx="23" cy="104" r="3" fill="#FFFFFF" opacity="0.18"/>

    <!-- padiglione destro -->
    <rect x="154" y="80" width="38" height="58" rx="18" fill="url(#hp-cup)"/>
    <circle cx="173" cy="109" r="13.5" fill="url(#hp-cushion)"/>
    <circle cx="173" cy="109" r="13.5" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.7"/>
    <circle cx="169" cy="104" r="3" fill="#FFFFFF" opacity="0.18"/>

    <!-- dettaglio led -->
    <circle cx="27" cy="90" r="1.6" fill="#7DE3F4"/>
  </g>
</svg>
